<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>VoidOS</Name>
    <Username>VoidOS</Username>
    <Title>VoidOS 2026</Title>
    <ShortDescription>VoidOS Playbook for Windows 10 22H2</ShortDescription>

    <Description><![CDATA[
Welcome to VoidOS 2026.

VoidOS is a performance-focused Windows 10 modification, built for
gaming, low latency and maximum responsiveness.

What this playbook does:
- Removes bloatware (Edge, OneDrive, Teams, built-in apps)
- Applies aggressive system optimizations and power plans
- Disables telemetry, tracking and background services
- Installs your preferred browser from a bundled offline installer
- Applies the VoidOS theme and wallpaper

Select your options:
The next pages let you customize your install. Recommended defaults
are pre-selected - you can simply click Next.
]]></Description>

    <Details>VoidOS 2026 - extreme performance, privacy and customization for Windows 10 22H2.</Details>

    <ProgressText><![CDATA[
VoidOS is installing software, applying optimizations,
and configuring your system. Please wait.
]]></ProgressText>

    <Version>2026.1</Version>

    <SupportedBuilds>
        <string>19045</string>
    </SupportedBuilds>

    <Requirements>
        <Requirement>PluggedIn</Requirement>
        <Requirement>NoPendingUpdates</Requirement>
    </Requirements>

    <UniqueId>564f4944-4f53-3236-564f-49444f533032</UniqueId>

    <Overhaul>true</Overhaul>
    <UseKernelDriver>false</UseKernelDriver>
    <AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>

    <EstimatedMinutes>15</EstimatedMinutes>

    <Git>https://github.com/VoidOSorg/playbook</Git>

    <SupportsISO>true</SupportsISO>

    <ISO>
        <DisableBitLocker>true</DisableBitLocker>
        <DisableHardwareRequirements>true</DisableHardwareRequirements>
    </ISO>

    <OOBE>
        <BulletPoints>
            <BulletPoint Icon="Rocket" Title="Performance"
                Description="Extreme optimization for gaming and responsiveness."/>
            <BulletPoint Icon="Lock" Title="Privacy"
                Description="Telemetry removal and system hardening."/>
            <BulletPoint Icon="Privacy" Title="Customization"
                Description="Themes, cursors and VoidOS branding."/>
        </BulletPoints>
        <Internet>Request</Internet>
    </OOBE>

    <!-- FEATURE PAGES -->
    <FeaturePages>

        <!-- THEME -->
        <RadioPage IsRequired="true" DefaultOption="theme-dark"
            Description="Select the default system theme applied during installation.">
            <TopLine Text="Dark is the recommended and default VoidOS look."/>
            <Options>
                <RadioOption>
                    <Text>Dark Theme (Recommended)</Text>
                    <Name>theme-dark</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Light Theme</Text>
                    <Name>theme-light</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <!-- BROWSER -->
        <RadioImagePage CheckDefaultBrowser="true"
            DefaultOption="browser-brave"
            Description="Select which browser will be installed from the bundled offline installer.">
            <TopLine Text="Brave is the recommended default - Chromium based, fast and private."/>
            <Options>
                <RadioImageOption None="true"/>

                <RadioImageOption>
                    <Text>Brave</Text>
                    <Name>browser-brave</Name>
                    <FileName>brave</FileName>
                    <GradientTopColor>#A33401</GradientTopColor>
                    <GradientBottomColor>#FFC481</GradientBottomColor>
                </RadioImageOption>

                <RadioImageOption>
                    <Text>Chrome</Text>
                    <Name>browser-chrome</Name>
                    <FileName>chrome</FileName>
                    <GradientTopColor>#3577E6</GradientTopColor>
                    <GradientBottomColor>#D0E6FF</GradientBottomColor>
                </RadioImageOption>

                <RadioImageOption>
                    <Text>Firefox</Text>
                    <Name>browser-firefox</Name>
                    <FileName>firefox</FileName>
                    <GradientTopColor>#FF3647</GradientTopColor>
                    <GradientBottomColor>#FFC742</GradientBottomColor>
                </RadioImageOption>
            </Options>
            <BottomLine Text="Leave your current browser installed" Link="https://docs.amelabs.net/general/browsers.html"/>
        </RadioImagePage>

        <!-- PERFORMANCE & SECURITY -->
        <CheckboxPage IsRequired="false"
            Description="Core recommendations. They are pre-selected and can be safely disabled.">
            <TopLine Text="VoidOS is designed to run with these optimizations enabled."/>
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Windows Defender &amp; Antimalware</Text>
                    <Name>remove-defender</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Apply Kernel 0 Performance Tweaks</Text>
                    <Name>kernel-tweaks</Name>
                </CheckboxOption>
            </Options>
            <BottomLine Text="Security Toggles explained" Link="https://docs.amelabs.net/guides/security-toggles.html"/>
        </CheckboxPage>

        <!-- CUSTOMIZATION -->
        <CheckboxPage IsRequired="false"
            Description="Optional extras. Leave everything unchecked for a clean minimal setup.">
            <TopLine Text="Themes and cursors match the VoidOS dark identity."/>
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Install VoidOS Themes</Text>
                    <Name>install-themes</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install VoidOS Cursors</Text>
                    <Name>install-cursors</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Copy VoidOS Tweaks Folder to Desktop</Text>
                    <Name>copy-tools</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

    </FeaturePages>
</Playbook>