---
title: Services
description: Disable unnecessary services (batched, with progress)
privilege: TrustedInstaller

actions:
  - !writeStatus: {status: "Disabling unnecessary services"}

  # Batch disable (single fast pass, per-service progress + timing)
  - !powerShell:
      exeDir: true
      wait: true
      command: >-
        .\Scripts\disable-services.ps1

  # Windows Defender services (only when "remove-defender" is checked)
  - !powerShell:
      exeDir: true
      wait: true
      option: "remove-defender"
      command: >-
        .\Scripts\disable-services.ps1 -IncludeDefender