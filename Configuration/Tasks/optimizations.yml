---
title: Optimizations
description: System performance optimizations
privilege: TrustedInstaller

actions:
  - !writeStatus: {status: "Applying system optimizations"}

  # Power Plan
  - !writeStatus: {status: "Setting High Performance Power Plan"}
  - !powerShell:
      wait: true
      exeDir: true
      errorAction: Ignore
      command: >-
        .\Scripts\set-power-plan.ps1

  # Scheduler / Latency
  - !writeStatus: {status: "Optimizing scheduler and latency"}
  - !powerShell:
      wait: true
      exeDir: true
      errorAction: Ignore
      command: >-
        .\Scripts\optimize-scheduler.ps1

  # Clean taskbar + pin File Explorer + chosen browser
  # (runs as elevated current user so HKCU tweaks hit the right profile and no extra UAC pops)
  - !powerShell:
      exeDir: true
      wait: true
      runas: currentUserElevated
      command: >-
        .\Scripts\CLEAN.ps1

